---

# Clickhouse

- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
      tags: [clickhouse, clickhouse-service]
  tasks:
    - name: Get clickhouse distrib
      ansible.builtin.get_url:
        url: >-
          https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.{{
          'x86_64.rpm' if item == 'clickhouse-common-static' else 'noarch.rpm'
          }}
        dest: "/var/tmp/{{ item }}-{{ clickhouse_version }}.rpm"
        mode: "0644"
      loop: "{{ clickhouse_packages }}"
      tags: [clickhouse, clickhouse-install]

    - name: Install clickhouse packages
      become: true
      ansible.builtin.dnf:
        name:
          - "/var/tmp/clickhouse-common-static-{{ clickhouse_version }}.rpm"
          - "/var/tmp/clickhouse-client-{{ clickhouse_version }}.rpm"
          - "/var/tmp/clickhouse-server-{{ clickhouse_version }}.rpm"
        disable_gpg_check: true
      notify: Start clickhouse service
      tags: [clickhouse, clickhouse-install]

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
      tags: [clickhouse, clickhouse-service]

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0
      tags: [clickhouse, clickhouse-config]


# Vector

- name: Install Vector
  hosts: vector
  roles:
    - vector-role


# Lighthouse

- name: Install and configure Lighthouse
  hosts: lighthouse # list of hosts
  become: true # add privilege for root
  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      tags: [lighthouse, lighthouse-service]

  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present # object must be
#        update_cache: true  # command apt-get update
      tags: [lighthouse, lighthouse-install] # tags for selective use

    - name: Download Lighthouse archive
      ansible.builtin.get_url: # module download files
        url: "https://github.com/VKCOM/lighthouse/archive/refs/heads/master.tar.gz"
        dest: /tmp/lighthouse.tar.gz # path download
        mode: '0644' # access files
      tags: [lighthouse, lighthouse-install]

    - name: Ensure /var/www exists
      ansible.builtin.file:
        path: /var/www
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: [lighthouse, lighthouse-install]

    - name: Extract Lighthouse to web directory
      ansible.builtin.unarchive: # unarchive module
        src: /tmp/lighthouse.tar.gz # path files
        dest: /var/www/ # path unarchave
        remote_src: true # enviroment (local)
        creates: /var/www/lighthouse-master #  make directory
      tags: [lighthouse, lighthouse-install]

    - name: Rename directory to lighthouse
      ansible.builtin.command: # command module
        cmd: mv /var/www/lighthouse-master /var/www/lighthouse
        creates: /var/www/lighthouse
      tags: [lighthouse, lighthouse-install]

    - name: Deploy nginx configuration for Lighthouse
      ansible.builtin.template: # use template nginx.conf
        src: nginx-lighthouse.conf.j2
        dest: /etc/nginx/conf.d/lighthouse.conf # path location nginx.conf
        owner: root # owner
        group: root # group
        mode: '0644' # access file
      notify: Reload nginx # handler reload nginx
      tags: [lighthouse, lighthouse-config]

    - name: Ensure nginx is running
      ansible.builtin.service: # management service
        name: nginx # name service
        state: started # systemctl start nginx
        enabled: true # systemctl enable nginx.service
      tags: [lighthouse, lighthouse-service]

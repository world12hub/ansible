#cloud-config
users:
  - name: ${username}
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}
package_update: true
package_upgrade: false
packages:
  - python3
  - python3-pip
  - python3-venv
  - apt-transport-https
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release



runcmd:
  - echo "Cloud-init завершён $(date)" > /var/log/cloud-init-done.log

---
# tasks file for lighthouse-role

- name: Install nginx
  ansible.builtin.dnf:
    name: "{{ web_server }}"
    state: present # object must be
#    update_cache: true  # command apt-get update
  tags: [lighthouse, lighthouse-install] # tags for selective use

- name: Download Lighthouse archive
  ansible.builtin.get_url: # module download files
    url: "{{ lighthouse_package_url }}"
    dest: "{{ lighthouse_tmp_tar }}" # path download
    mode: "{{ lighthouse_config_mode }}" # access files
  tags: [lighthouse, lighthouse-install]

- name: Ensure /var/www exists
  ansible.builtin.file:
    path: "{{ dir_web_server }}"
    state: directory
    owner: "{{ lighthouse_config_owner }}"
    group: "{{ lighthouse_config_group }}"
    mode: "{{ lighthouse_var_www_mode }}"
  tags: [lighthouse, lighthouse-install]

- name: Extract Lighthouse to web directory
  ansible.builtin.unarchive:
    src: "{{ lighthouse_tmp_tar }}"
    dest: "{{ dir_lighthouse }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "{{ dir_lighthouse }}/index.html"
  tags: [lighthouse, lighthouse-install]

- name: Deploy nginx configuration for Lighthouse
  ansible.builtin.template: # use template nginx.conf
    src: nginx-lighthouse.conf.j2
    dest: "{{ lighthouse_config_file }}" # path location nginx.conf
    owner: "{{ lighthouse_config_owner }}" # owner
    group: "{{ lighthouse_config_group }}" # group
    mode: "{{ lighthouse_config_mode }}" # access file
  notify: Reload nginx # handler reload nginx
  tags: [lighthouse, lighthouse-config]

- name: Ensure nginx is running
  ansible.builtin.service: # management service
    name: "{{ web_server }}" # name service
    state: started # systemctl start nginx
    enabled: true # systemctl enable nginx.service
  tags: [lighthouse, lighthouse-service]

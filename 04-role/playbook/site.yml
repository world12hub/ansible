---

# ClickHouse
- name: Install ClickHouse
  hosts: clickhouse
  roles:
    - clickhouse

# Vector
- name: Install Vector
  hosts: vector
  roles:
    - vector

# Lighthouse
- name: Install Lighthouse
  hosts: lighthouse
  tasks:
    - name: Wait for ClickHouse to be reachable
      ansible.builtin.wait_for:
        host: "{{ clickhouse_host | default('clickhouse') }}"
        port: 8123
        timeout: 30

    - name: Apply Lighthouse role
      ansible.builtin.include_role:
        name: lighthouse
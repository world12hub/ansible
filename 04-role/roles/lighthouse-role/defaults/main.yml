---
# defaults file for lighthouse-role
lighthouse_package_url: >-
  https://github.com/VKCOM/lighthouse/archive/refs/heads/master.tar.gz

lighthouse_tmp_tar: "/tmp/lighthouse.tar.gz"

dir_lighthouse: "{{ dir_web_server }}/lighthouse"
dir_web_server: "/var/www/"

lighthouse_config_dir: /etc/nginx/conf.d/
lighthouse_config_file: "{{ lighthouse_config_dir }}/lighthouse.conf" 